# 按需取用
server {
    listen 443 ssl;
    server_name a1nas.geesdev.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {

        # ===== 干掉后端CORS（关键）=====
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # ===== 预检请求 =====
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, COPY, MOVE, LOCK, UNLOCK";
            add_header Access-Control-Allow-Headers "*";
            return 204;
        }
        
        # ====转发至后端====
        proxy_pass http://host.docker.internal:5005/团队文件-webdav-test/;

        # ===== 统一CORS出口 =====
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, COPY, MOVE, LOCK, UNLOCK" always;
        add_header Access-Control-Allow-Headers "*" always;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        alias /nginx/nfs/;
        autoindex on;
    }
}