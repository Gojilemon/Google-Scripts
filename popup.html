
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MFA & AK/SK Manager</title>
  <!-- 引入 Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body class="bg-light transition-theme">
  <div class="container-fluid p-3" style="width: 320px;">
    <div class="header-container mb-3">
      <h5 class="m-0 title-text">MFA & AK/SK 助手</h5>
      <div class="theme-switch-wrapper">
        <span class="theme-icon-small">☀️</span>
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round"></div>
        </label>
        <span class="theme-icon-small">🌙</span>
      </div>
    </div>

    <!-- Tab 导航栏 -->
    <ul class="nav nav-tabs mb-3" id="mainTab">
      <li class="nav-item">
        <button class="nav-link active" id="mfa-tab-btn">MFA Codes</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="ak-sk-tab-btn">AK/SK Pairs</button>
      </li>
    </ul>

    <!-- Tab 内容区 -->
    <div class="tab-content" id="mainTabContent">
      <!-- MFA 页面 -->
      <div class="tab-pane-custom active" id="mfa-pane">
        <div class="mb-3">
          <button id="toggle-add-mfa" class="btn btn-outline-primary btn-sm w-100">+ 添加新 MFA</button>
        </div>
        <div class="card mb-3 shadow-sm d-none" id="add-mfa-card">
          <div class="card-body">
            <div class="mb-2">
              <input type="text" id="mfa-name" class="form-control form-control-sm" placeholder="名称 (如: GitHub, AWS)">
            </div>
            <div class="mb-2">
              <input type="text" id="mfa-secret" class="form-control form-control-sm" placeholder="MFA Secret 密钥">
            </div>
            <div class="mb-2 d-flex gap-2">
              <button id="upload-qr" class="btn btn-outline-secondary btn-sm flex-grow-1">上传图片</button>
              <button id="scan-page" class="btn btn-outline-secondary btn-sm flex-grow-1">截图扫描</button>
              <input type="file" id="qr-file-input" class="d-none" accept="image/*">
            </div>
            <div class="small text-muted mb-2 text-center">提示：支持直接 Ctrl+V 粘贴截图</div>
            <!-- 实时预览预览 -->
            <div id="mfa-preview" class="mb-2 d-none">
              <div class="alert alert-info py-1 px-2 mb-0 small text-center">
                预览动态码: <strong id="preview-code">------</strong>
              </div>
            </div>
            <button id="add-mfa" class="btn btn-primary btn-sm w-100">保存 MFA</button>
          </div>
        </div>
        <div id="mfa-list">
          <!-- MFA 列表项将在这里动态生成 -->
        </div>
      </div>

      <!-- AK/SK 页面 -->
      <div class="tab-pane-custom d-none" id="ak-sk-pane">
        <div class="mb-3">
          <button id="toggle-add-aksk" class="btn btn-outline-success btn-sm w-100">+ 添加新 AK/SK 对</button>
        </div>
        <div class="card mb-3 shadow-sm d-none" id="add-aksk-card">
          <div class="card-body">
            <div class="mb-2">
              <input type="text" id="ak-sk-name" class="form-control form-control-sm" placeholder="描述名称">
            </div>
            <div class="mb-2">
              <input type="text" id="ak" class="form-control form-control-sm" placeholder="Access Key">
            </div>
            <div class="mb-2">
              <input type="text" id="sk" class="form-control form-control-sm" placeholder="Secret Key">
            </div>
            <button id="add-ak-sk" class="btn btn-success btn-sm w-100">保存 AK/SK</button>
          </div>
        </div>
        <div id="ak-sk-list">
          <!-- AK/SK 列表项将在这里动态生成 -->
        </div>
      </div>
    </div>

    <!-- 底部署名 -->
    <div class="footer mt-2 text-center">
      <!-- <hr class="mb-2 opacity-10"> -->
      <small class="text-muted italic">任鹏宇:盐水儿@v1.0</small>
    </div>
  </div>

  <!-- 移除外部 JS，使用本地逻辑 -->
  <script src="jsQR.js"></script>
  <script src="otpauth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
